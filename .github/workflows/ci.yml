name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.3', '3.4', '4.0']
        exclude:
          - { os: macos-latest, ruby: '3.3' }
          - { os: macos-latest, ruby: '4.0' }
          - { os: windows-latest, ruby: '3.3' }
          - { os: windows-latest, ruby: '4.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake lint deps types bench
      - run: gem build mermaid_term.gemspec
  alt-ruby:
    continue-on-error: true
    strategy:
      matrix:
        ruby: [jruby, truffleruby]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
